<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P2P File Share</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/history.js"></script>
  <script type="module" src="js/webrtc.js"></script>
  <script type="module" src="js/fallback.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="outer-container">
    <div class="inner-panel">

      <div id="error-box" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-500/20 border border-red-500/40 text-red-200 rounded-lg px-5 py-2.5 text-sm font-medium max-w-lg w-full text-center"></div>

      <main class="h-full w-full overflow-hidden p-3 lg:p-4 flex items-center">

        <div id="pc-view" class="hidden w-full h-full grid grid-cols-1 lg:grid-cols-3 gap-3 lg:gap-4">

          <!-- LEFT+MIDDLE COMBINED (2/3) -->
          <div class="lg:col-span-2 flex flex-col gap-3 lg:gap-4 h-full overflow-hidden">

            <!-- Title – white pill -->
            <div class="shrink-0 bg-white rounded-full px-4 py-2 flex items-center gap-2 shadow-sm w-fit">
              <svg class="w-5 h-5 text-[#1a1a1a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              <h1 class="text-lg font-bold tracking-tight text-[#1a1a1a]">P2P <span class="text-[#555]">Share</span></h1>
            </div>

            <!-- 1:1 split: Info (flex-1) and Row (flex-1) -->
            <div class="flex-1 flex flex-col gap-3 lg:gap-4 min-h-0">
              <!-- Info section – only QR and heading -->
              <div class="flex-1 bg-[#18181b] border border-[#2a2a2e] rounded-xl p-5 overflow-hidden flex flex-col items-center justify-center">
                <h2 class="text-2xl font-bold text-white tracking-tight mb-2">Scan the QR code to connect</h2>
                <p class="text-sm text-zinc-400 mb-3">Point your phone camera here</p>
                <div id="qrcode" class="bg-white p-2 rounded-lg"></div>
              </div>

              <!-- Row: Mode Selector (2) + Send Files (3) -->
              <div class="flex-1 flex gap-3 lg:gap-4 min-h-0">
                <!-- Mode Selector – 2 parts -->
                <div class="flex-[2] bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 flex flex-col justify-center min-h-0 overflow-hidden">
                  <h3 class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider mb-2 text-center">Transfer Mode</h3>
                  <div class="flex rounded-full bg-[#1a1a1a] p-1 border border-[#2a2a2e] w-full max-w-[220px] mx-auto" id="mode-toggle">
                    <label class="flex-1 text-center py-2 px-4 rounded-full text-sm font-medium cursor-pointer transition-colors" data-mode="webrtc">
                      <input type="radio" name="mode" value="webrtc" class="hidden peer" checked />
                      <span class="peer-checked:bg-white peer-checked:text-[#1a1a1a] peer-checked:shadow-sm text-zinc-400 block py-1 px-2 rounded-full transition-all">Direct</span>
                    </label>
                    <label class="flex-1 text-center py-2 px-4 rounded-full text-sm font-medium cursor-pointer transition-colors" data-mode="fallback">
                      <input type="radio" name="mode" value="fallback" class="hidden peer" />
                      <span class="peer-checked:bg-white peer-checked:text-[#1a1a1a] peer-checked:shadow-sm text-zinc-400 block py-1 px-2 rounded-full transition-all">Relay</span>
                    </label>
                  </div>
                </div>

                <!-- Send Files – 3 parts -->
                <div class="flex-[3] bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 flex flex-col min-h-0 overflow-hidden">
                  <div class="flex items-center justify-between mb-2">
                    <h2 class="text-[11px] font-semibold text-zinc-400 uppercase tracking-wider flex items-center gap-2">
                      <svg class="w-4 h-4 text-[#b0b0b0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                      Send Files
                    </h2>
                    <span class="text-[9px] bg-[#222226] text-zinc-400 px-2 py-0.5 rounded border border-[#2a2a2e]">Multiple</span>
                  </div>
                  <label id="drop-zone" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-[#2a2a2e] hover:border-[#5a5a5e] hover:bg-[#1a1a1e] rounded-xl cursor-pointer transition-all group min-h-[60px]">
                    <input type="file" id="file-input-pc" class="hidden" multiple />
                    <div class="text-center p-2">
                      <div class="w-12 h-12 rounded-xl bg-[#121214] group-hover:bg-[#1e1e22] flex items-center justify-center mx-auto mb-1.5 transition">
                        <svg class="w-6 h-6 text-zinc-500 group-hover:text-[#b0b0b0] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                      </div>
                      <span class="text-sm font-medium text-zinc-200 group-hover:text-white block">Click or drag</span>
                      <span class="text-[10px] text-zinc-500">Files & folders</span>
                    </div>
                  </label>
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN (1/3) – Transfers -->
          <div class="flex flex-col gap-2 h-full overflow-hidden">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wider">Transfers</h2>
              <button onclick="clearHistory()" class="text-[10px] text-zinc-500 hover:text-red-400 transition">Clear All</button>
            </div>
            <div class="bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 flex-1 flex flex-col min-h-0 overflow-hidden">
              <div id="history-list" class="flex-1 overflow-y-auto space-y-1.5 pr-1">
                <div id="history-empty" class="h-full flex flex-col items-center justify-center text-zinc-600">
                  <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                  <p class="text-sm font-medium">No files transferred yet</p>
                  <p class="text-[10px] mt-0.5">Sent and received files appear here</p>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- Mobile View (unchanged) -->
        <div id="mobile-view" class="hidden w-full h-full flex flex-col gap-3 overflow-y-auto pb-3">
          <div class="bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 text-center shrink-0">
            <div class="flex items-center justify-center gap-2 mb-2">
              <div class="w-7 h-7 rounded-lg bg-[#2a2a2e] flex items-center justify-center">
                <svg class="w-4 h-4 text-[#e0e0e0]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              </div>
              <h1 class="text-base font-semibold text-zinc-200">P2P <span class="text-[#b0b0b0]">Share</span></h1>
            </div>
            <p id="connection-status" class="text-[#b0b0b0] font-medium text-sm">Establishing link...</p>
          </div>

          <div class="bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 shrink-0">
            <h3 class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider mb-2">Send Files</h3>
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-[#2a2a2e] hover:border-[#5a5a5e] hover:bg-[#1a1a1e] rounded-xl cursor-pointer transition min-h-[90px]">
              <input type="file" id="file-input-mobile" class="hidden" multiple />
              <svg class="w-7 h-7 text-zinc-500 group-hover:text-[#b0b0b0] mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              <span class="text-sm font-medium text-zinc-300">Tap to select</span>
            </label>
          </div>

          <div class="bg-[#18181b] border border-[#2a2a2e] rounded-xl p-4 flex-1 flex flex-col min-h-0">
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">History</h3>
              <button onclick="clearHistory()" class="text-[9px] text-zinc-500 hover:text-red-400">Clear</button>
            </div>
            <div id="history-list-mobile" class="flex-1 overflow-y-auto space-y-1.5">
              <div id="history-empty-mobile" class="h-full flex flex-col items-center justify-center text-zinc-600 py-4">
                <p class="text-sm font-medium">No files yet</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
